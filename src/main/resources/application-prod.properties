# Lancer avec : java -jar app.jar --spring.profiles.active=prod
# Force HTTPS (redirection) et durcit le cookie de session.
site.force-https=true

# Derrière un proxy / hébergeur qui termine le TLS (X-Forwarded-Proto)
server.forward-headers-strategy=native

server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true

# Ne jamais laisser les identifiants de base en dur en production
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
