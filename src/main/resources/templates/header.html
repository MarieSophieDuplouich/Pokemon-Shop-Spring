<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">

<div th:fragment="header">
	<!-- header -->
	<header id="header" lang="en" style="z-index: 1">
		<!-- Primary navbar -->
		<nav class="navbar navbar-expand-lg navbar-light color-header-bg" aria-label="Main">
			<!-- Rocket Logo (image décorative : le texte "ROCKET" suffit) -->
			<a class="navbar-brand font-baloo font-size-16" th:href="@{/}"> <img th:src="@{/images/clipart1530219.png}" width="35" height="31" alt="">ROCKET
			</a>

			<button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>

			<div class="collapse navbar-collapse" id="navbarSupportedContent">
				<ul class="navbar-nav float-left">
					<li class="nav-item"><a class="nav-link font-baloo font-weight-bold font-size-18" th:href="@{/}">About</a></li>
					<li class="nav-item dropdown"><a class="nav-link font-baloo font-weight-bold font-size-18 dropdown-toggle" th:href="@{/}" id="dropdownService" role="button" data-toggle="dropdown"
						aria-haspopup="true" aria-expanded="false"> Service </a>
						<div class="dropdown-menu" aria-labelledby="dropdownService">
							<a class="dropdown-item font-baloo" th:href="@{/cgu}"><i class="fas fa-book" aria-hidden="true"></i> Terms</a>
							<a class="dropdown-item font-baloo" th:href="@{/cgu#retractation}"><i class="fas fa-file-word" aria-hidden="true"></i> Withdrawal right</a>
							<a class="dropdown-item font-baloo" th:href="@{/maintenance}"><i class="fas fa-syringe" aria-hidden="true"></i> Disease Control</a>
						</div></li>
					<li class="nav-item dropdown"><a class="nav-link font-baloo font-weight-bold font-size-18 dropdown-toggle" th:href="@{/}" id="dropdownSupport" role="button" data-toggle="dropdown"
						aria-haspopup="true" aria-expanded="false"> Support </a>
						<div class="dropdown-menu" aria-labelledby="dropdownSupport">
							<a class="dropdown-item font-baloo" th:href="@{/maintenance}"><i class="fa fa-envelope" aria-hidden="true"></i> Email</a>
							<a class="dropdown-item font-baloo" th:href="@{/maintenance}"><i class="fa fa-comments" aria-hidden="true"></i> Chat</a>
							<a class="dropdown-item font-baloo" th:href="@{/maintenance}"><i class="fa fa-phone" aria-hidden="true"></i> Phone Support</a>
							<a class="dropdown-item font-baloo" th:href="@{/maintenance}"><i class="fa fa-credit-card" aria-hidden="true"></i> Make a Payment</a>
						</div></li>
				</ul>

				<!-- Search box -->
				<div class="search form-inline navbar-center m-auto">
					<form th:action="@{/search-result}" method="get" role="search" class="form-inline">
						<label for="search-box" class="sr-only">Search Pokémon</label>
						<input id="search-box" class="form-control mr-sm-2 search-box" type="search" placeholder="Search..." name="search" maxlength="100" autocomplete="off">
						<button class="btn btn-primary" type="submit">Search</button>
					</form>
				</div>

				<!-- Sign in & Cart section -->
				<ul class="navbar-nav float-left">
					<li class="nav-item"><a class="nav-link font-baloo font-weight-bold font-size-16 px-4" sec:authorize="isAuthenticated()" th:href="@{#}"> <span class="font-size-12">Hey,</span>
							[[${#request.userPrincipal.principal.getfirstName()}]]
					</a> <a class="nav-link font-baloo font-weight-bold font-size-16 px-4" sec:authorize="isAnonymous()" th:href="@{/register}"><i class="fas fa-signature" aria-hidden="true"></i> Sign Up</a></li>
					<li class="nav-item"><a class="nav-link font-baloo font-weight-bold font-size-16 px-4" sec:authorize="isAuthenticated()" th:href="@{/logout}"><i
							class="fas fa-sign-out-alt" aria-hidden="true"></i> Logout</a> <a class="nav-link font-baloo font-weight-bold font-size-16 px-4" sec:authorize="isAnonymous()" th:href="@{/login}"><i
							class="fas fa-sign-in-alt" aria-hidden="true"></i> Login</a></li>
					<li class="nav-item"><a class="nav-link font-baloo font-weight-bold font-size-16 px-4" sec:authorize="hasRole('ADMIN')" th:href="@{/list}"><i class="fas fa-th-list" aria-hidden="true"></i>
							List</a> <a class="nav-link font-baloo font-weight-bold font-size-16 px-4" sec:authorize="!hasRole('ADMIN')" th:href="@{/maintenance}"><i class="fas fa-shopping-cart" aria-hidden="true"></i> Cart (0)</a></li>
				</ul>
			</div>
		</nav>

		<!-- Secondary navbar : toujours visible (l'ancienne version était masquée sur mobile, sans bouton pour l'ouvrir) -->
		<nav class="color-navbar-bg" aria-label="Categories">
			<ul class="nav justify-content-center flex-wrap font-rubik">
				<li class="nav-item"><a class="nav-link" th:href="@{/product-list}">Pokemons</a></li>
				<li class="nav-item"><a class="nav-link" th:href="@{/maintenance}">Best Sellers</a></li>
				<li class="nav-item"><a class="nav-link" th:href="@{/maintenance}">New Releases</a></li>
				<li class="nav-item"><a class="nav-link" th:href="@{/maintenance}">Coming Soon</a></li>
			</ul>
		</nav>
	</header>
</div>
</html>
