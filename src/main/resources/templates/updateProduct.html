<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:replace="fragments :: head('Edit a Pokémon – ROCKET (fictional shop)', 'Edit a product of the fictional ROCKET shop (Java learning project).')"></head>
<body>
	<div th:replace="fragments :: top"></div>
	<div th:insert="/header :: header"></div>

	<main id="main">
		<section class="section" sec:authorize="hasRole('ADMIN')" aria-labelledby="edit-title">
			<div class="container">
				<h2 id="edit-title">Update [[${selectedProd.title}]]</h2>

				<form th:action="@{/edit-product/{id}(id=${selectedProd.id})}" th:object="${selectedProd}" method="POST" enctype="multipart/form-data">
					<div class="form-row">
						<div class="col-sm-6 form-group">
							<label for="title" class="sr-only">Name</label>
							<input type="text" name="pkmName" th:field="*{title}" class="form-control" placeholder="Name" required maxlength="100">
						</div>
						<div class="col-sm-6 form-group">
							<label for="type" class="sr-only">Type</label>
							<input type="text" name="pkmType" th:field="*{type}" class="form-control" placeholder="Type" required maxlength="30">
						</div>
					</div>
					<div class="form-row">
						<div class="col-sm-4 form-group">
							<label for="MSRP" class="sr-only">MSRP</label>
							<input type="number" name="pkmMSRP" th:field="*{MSRP}" class="form-control" placeholder="MSRP" min="0" step="0.01">
						</div>
						<div class="col-sm-4 form-group">
							<label for="price" class="sr-only">Sale price</label>
							<input type="number" name="pkmPrice" th:field="*{price}" class="form-control" placeholder="Sale Price" required min="0" step="0.01">
						</div>
						<div class="col-sm-4 form-group">
							<label for="rating" class="sr-only">Rating from 0 to 5</label>
							<input type="number" name="pkmRating" th:field="*{rating}" class="form-control" placeholder="Rate (0-5)" min="0" max="5" step="0.1">
						</div>
					</div>
					<div class="form-group">
						<label for="pkmDesc" class="sr-only">Description</label>
						<textarea name="pkmDesc" th:field="*{pkmDesc}" class="form-control" rows="5" placeholder="Description" maxlength="5000"></textarea>
					</div>
					<div class="form-row align-items-center">
						<div class="col-sm-9 form-group">
							<label for="imgAddr" class="sr-only">Image</label>
							<input type="file" name="imgFile" th:field="*{imgAddr}" class="form-control-file pointer">
						</div>
						<div class="col-sm-3 form-group">
							<button type="submit" class="btn btn-primary">UPDATE</button>
						</div>
					</div>
				</form>
			</div>
		</section>
	</main>

	<div th:replace="fragments :: footer"></div>
</body>
</html>
