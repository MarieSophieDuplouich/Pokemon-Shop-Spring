<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:replace="fragments :: head('Sign up – ROCKET (fictional shop)', 'Create a demo account on ROCKET, a fictional shop built to learn Java. Use made-up data.')"></head>
<body>
	<div th:replace="fragments :: top"></div>
	<div th:insert="/header :: header"></div>

	<main id="main">
		<section class="section" aria-labelledby="signup-title">
			<div class="container">
				<h1 id="signup-title">Sign Up</h1>
				<p lang="fr"><strong>Site fictif.</strong> Ce compte est un compte de démonstration : saisissez des données inventées (adresse e-mail fictive, mot de passe que vous n'utilisez nulle part ailleurs). Voir la <a th:href="@{/confidentialite}">politique de confidentialité</a>.</p>
				<form th:action="@{/register-success}" th:object="${user}" method="post" style="max-width: 600px">
				<div class="form-group row">
					<label for="email" class="col-sm-3 col-form-label">E-mail</label>
					<div class="col-sm-9">
						<input type="email" th:field="*{email}" class="form-control" required maxlength="45" autocomplete="email" />
					</div>
				</div>
				<div class="form-group row">
					<label for="password" class="col-sm-3 col-form-label">Password</label>
					<div class="col-sm-9">
						<input type="password" th:field="*{password}" class="form-control" required minlength="8" maxlength="30" autocomplete="new-password" aria-describedby="pwd-help" />
						<small id="pwd-help">8 to 30 characters.</small>
					</div>
				</div>
				<div class="form-group row">
					<label for="firstName" class="col-sm-3 col-form-label">First Name</label>
					<div class="col-sm-9">
						<input type="text" th:field="*{firstName}" class="form-control" required maxlength="30" autocomplete="given-name" />
					</div>
				</div>
				<div class="form-group row">
					<label for="lastName" class="col-sm-3 col-form-label">Last Name</label>
					<div class="col-sm-9">
						<input type="text" th:field="*{lastName}" class="form-control" required maxlength="30" autocomplete="family-name" />
					</div>
				</div>
				<div class="form-group form-check" lang="fr">
					<input type="checkbox" class="form-check-input" id="terms" name="terms" required>
					<label class="form-check-label" for="terms">J'ai lu la <a th:href="@{/confidentialite}">politique de confidentialité</a> et les <a th:href="@{/cgu}">conditions d'utilisation</a>.</label>
				</div>
				<button type="submit" class="btn btn-primary">Sign Up</button>
				</form>
			</div>
		</section>
	</main>

	<div th:replace="fragments :: footer"></div>
</body>
</html>
