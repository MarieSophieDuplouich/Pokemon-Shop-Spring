<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:replace="fragments :: head('Users – ROCKET (fictional shop)', 'Administration list of demo users of the fictional ROCKET shop.')"></head>
<body>
	<div th:replace="fragments :: top"></div>
	<div th:insert="/header :: header"></div>

	<main id="main">
		<section class="section" aria-labelledby="users-title">
			<div class="container">
				<h1 id="users-title">List of Users</h1>
				<div class="table-responsive">
					<table class="table">
						<caption class="sr-only">Registered demo users</caption>
						<thead>
							<tr>
								<th scope="col">ID#</th>
								<th scope="col">Full name</th>
								<th scope="col">E-mail</th>
								<th scope="col">Role</th>
								<th scope="col">Actions</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="user: ${userList}">
								<td th:text="${user.id}"></td>
								<td th:text="${user.firstName} + ' ' + ${user.lastName}"></td>
								<td th:text="${user.email}"></td>
								<td th:text="${user.role}"></td>
								<td><a th:href="@{/edit/{id}(id=${user.id})}" th:attr="aria-label='Edit user ' + ${user.id}"><i class="far fa-edit font-size-18 hover" aria-hidden="true"></i></a> &emsp; <form th:unless="${user.admin}" th:action="@{/delete/{id}(id=${user.id})}" method="post" class="d-inline">
									<button type="submit" class="btn-icon" th:attr="aria-label='Delete user ' + ${user.id}"><i class="far fa-trash-alt font-size-18 hover" aria-hidden="true"></i></button>
								</form></td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</section>
	</main>

	<div th:replace="fragments :: footer"></div>
</body>
</html>
