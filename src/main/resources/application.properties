# Connection configuration
server.port=8083

spring.datasource.url=jdbc:mysql://localhost:3306/rocket?serverTimezone=GMT-6
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate table creation
spring.jpa.hibernate.ddl-auto=create
#spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true

# HTTPS : désactivé en local. Activé par le profil "prod" (voir application-prod.properties).
site.force-https=false

# Compte administrateur (créé au démarrage). Ne jamais écrire le mot de passe ici :
#   ADMIN_EMAIL=admin@exemple.test ADMIN_PASSWORD='un-mot-de-passe-long' mvn spring-boot:run
site.admin.email=${ADMIN_EMAIL:}
site.admin.password=${ADMIN_PASSWORD:}
